<title>Decisions for Ben</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a calm personal inbox. One 760px reading column: a quiet greeting with counts and the cutoff clock, then soft question tiles that open in place, then status rows, then Claude's activity feed. Separation by space and surface, not lines. */
:root {
  --bg: #f3f4f6; --surface: #ffffff; --sunken: #eef0f3; --ink: #15171c; --muted: #5d6370; --faint: #949aa6; --line: #e2e4e9;
  --accent: #3245cf; --accent-ink: #ffffff; --accent-soft: #eceefc;
  --info: #2763c4; --info-soft: #e7effb; --ok: #1d7a4f; --ok-soft: #e3f2ea; --warn: #9a5a00; --warn-soft: #fbf0dc; --err: #b42318; --err-soft: #fcebe9; --teal: #0e7470; --teal-soft: #dcf1ef;
  --sh-1: 0 1px 2px rgba(20, 23, 30, 0.05), 0 1px 1px rgba(20, 23, 30, 0.03);
  --sh-2: 0 1px 2px rgba(20, 23, 30, 0.05), 0 10px 30px -12px rgba(20, 23, 30, 0.16);
  --display: "Bricolage Grotesque", "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --sans: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r-lg: 18px; --r-md: 12px; --r-sm: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1013; --surface: #17191e; --sunken: #1f2127; --ink: #e9ebf0; --muted: #a2a8b4; --faint: #6f7581; --line: #2b2e36;
  --accent: #909cff; --accent-ink: #0f1013; --accent-soft: #232748;
  --info: #7fb0ff; --info-soft: #182840; --ok: #6fcb9b; --ok-soft: #16291f; --warn: #e6aa52; --warn-soft: #33270f; --err: #f28b82; --err-soft: #3a1f1d; --teal: #5cc6c0; --teal-soft: #12302e;
  --sh-1: 0 1px 2px rgba(0, 0, 0, 0.4); --sh-2: 0 1px 2px rgba(0, 0, 0, 0.4), 0 12px 32px -12px rgba(0, 0, 0, 0.7); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1013; --surface: #17191e; --sunken: #1f2127; --ink: #e9ebf0; --muted: #a2a8b4; --faint: #6f7581; --line: #2b2e36;
  --accent: #909cff; --accent-ink: #0f1013; --accent-soft: #232748;
  --info: #7fb0ff; --info-soft: #182840; --ok: #6fcb9b; --ok-soft: #16291f; --warn: #e6aa52; --warn-soft: #33270f; --err: #f28b82; --err-soft: #3a1f1d; --teal: #5cc6c0; --teal-soft: #12302e;
  --sh-1: 0 1px 2px rgba(0, 0, 0, 0.4); --sh-2: 0 1px 2px rgba(0, 0, 0, 0.4), 0 12px 32px -12px rgba(0, 0, 0, 0.7); color-scheme: dark }

html { overflow-anchor: none; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 760px; margin: 0 auto; padding-block: 56px 160px; display: flex; flex-direction: column; gap: 52px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }
code { font-family: var(--mono); font-size: 0.86em; background: var(--sunken); border-radius: 5px; padding: 1px 5px; overflow-wrap: anywhere; }

/* header */
header { display: flex; flex-direction: column; gap: 4px; }
.date { margin: 0; font-size: 0.87rem; color: var(--muted); }
h1 { font-family: var(--display); font-size: clamp(1.9rem, 6vw, 2.5rem); font-weight: 600; letter-spacing: -0.025em; line-height: 1.1; margin: 0; text-wrap: balance; }
.hud { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; margin-top: 14px; }
.status-line { margin: 0; display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 0.93rem; font-variant-numeric: tabular-nums; }
.status-line span { display: inline-flex; align-items: center; gap: 7px; }
.status-line i { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
.status-line .need i { background: var(--accent); }
.status-line .prog i { background: var(--info); }
.status-line .others i { background: var(--faint); }
.status-line .done i { background: var(--ok); }
.status-line b, .countdown b { color: var(--ink); font-weight: 600; }
.countdown { margin: 0; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.93rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.countdown .passed b { color: var(--faint); font-weight: 500; }

/* sections */
section { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
h2 { font-family: var(--display); font-size: 1.05rem; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); margin: 0 0 0 2px; }
.sec-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.grp-head { margin: 10px 0 -4px 2px; font-size: 0.82rem; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.grp-head:first-child { margin-top: 0; }
.notice { padding: 14px 16px; border-radius: var(--r-md); background: var(--surface); color: var(--muted); box-shadow: var(--sh-1); }
.notice.err { background: var(--err-soft); color: var(--ink); box-shadow: none; }
.calm { padding: 36px 20px; text-align: center; color: var(--muted); background: var(--surface); border-radius: var(--r-lg); }
.calm strong { display: block; color: var(--ink); font-family: var(--display); font-size: 1.1rem; font-weight: 600; margin-bottom: 2px; }
.calm.small { padding: 16px 18px; text-align: left; margin: 0; background: none; }

/* sort */
.sort { position: relative; display: inline-flex; align-items: center; gap: 4px; min-height: 34px; padding: 0 12px; border-radius: 99px; background: var(--surface); box-shadow: var(--sh-1); color: var(--muted); font-size: 0.84rem; cursor: pointer; transition: color 0.15s; }
.sort:hover, .sort:focus-within { color: var(--accent); }
.sort:has(select:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.sort select { appearance: none; -webkit-appearance: none; background: transparent; border: 0; border-radius: 0; color: var(--ink); font: inherit; font-weight: 600; padding: 7px 18px 7px 0; margin-right: -14px; cursor: pointer; max-width: 100%; }
.sort select:focus-visible { outline: none; }
.sort:hover select, .sort:focus-within select { color: var(--accent); }
.sort option { color: var(--ink); background: var(--surface); }
.sort-ico { width: 12px; height: 12px; flex: none; pointer-events: none; }

/* tiles */
#tiles, .rows, #recent { display: flex; flex-direction: column; gap: 12px; }
.tile { --indent: 20px; position: relative; background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--sh-1); min-width: 0; transition: box-shadow 0.2s; }
.tile:not(.row):hover, .tile.open { box-shadow: var(--sh-2); }
.tile-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 8px; align-items: start; width: 100%; text-align: left; background: none; border: 0; padding: 20px 20px 0 20px; cursor: pointer; border-radius: var(--r-lg) var(--r-lg) 0 0; }
.tt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.title { font-family: var(--display); font-size: 1.16rem; font-weight: 600; letter-spacing: -0.012em; line-height: 1.3; text-wrap: balance; overflow-wrap: anywhere; }
.sum { color: var(--muted); font-size: 0.95rem; line-height: 1.5; overflow-wrap: anywhere; }
.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.chev { width: 7px; height: 7px; margin: 9px 4px 0 10px; border-right: 1.5px solid var(--faint); border-bottom: 1.5px solid var(--faint); transform: rotate(45deg); transition: transform 0.2s; }
.tile.open > .tile-head .chev { transform: rotate(-135deg); margin-top: 12px; }
.metas { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin-top: 6px; font-size: 0.82rem; color: var(--muted); min-width: 0; }
.area-tag { font-weight: 600; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--line); flex: none; }
.chip.red { color: var(--err); font-weight: 600; } .chip.red::before { background: var(--err); }
.chip.amber { color: var(--warn); font-weight: 600; } .chip.amber::before { background: var(--warn); }
.tk { display: inline-flex; align-items: center; gap: 6px; font-size: 0.76rem; font-weight: 500; padding: 1px 9px 1px 8px; border-radius: 99px; white-space: nowrap; background: var(--sunken); color: var(--muted); font-variant-numeric: tabular-nums; }
.tk::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--faint); flex: none; }
.tk.t-done::before { background: var(--ok); }
.tk.t-test::before { background: var(--teal); }
.tk.t-prog::before { background: var(--info); }
.fresh { font-size: 0.76rem; font-weight: 600; color: var(--info); }
.fresh.upd { color: var(--teal); }
.agentchip { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.agentchip.failed { color: var(--err); }

.tile-foot { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 14px 20px 20px var(--indent); }
.rec-line { font-size: 0.9rem; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.rec-line b { color: var(--ink); font-weight: 600; }
.picked { display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; font-weight: 600; color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
.picked::before { content: "✓"; display: grid; place-items: center; flex: none; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 0.7rem; font-weight: 700; }
.acts, .row-acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.accept { flex: none; background: var(--accent-soft); color: var(--accent); border: 0; border-radius: 99px; padding: 7px 15px; font-size: 0.86rem; font-weight: 600; cursor: pointer; transition: background 0.15s, color 0.15s, box-shadow 0.15s; }
.accept:hover { box-shadow: inset 0 0 0 1px var(--accent); }
.accept.undo, .accept.ghost { background: transparent; color: var(--muted); font-weight: 500; box-shadow: inset 0 0 0 1px var(--line); }
.accept.undo:hover, .accept.ghost:hover, .accept.ghost:focus-visible { color: var(--ink); box-shadow: inset 0 0 0 1px var(--faint); }
.send-one { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 99px; padding: 8px 18px; font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: opacity 0.15s; }
.send-one:disabled { opacity: 0.35; cursor: default; }
.linkbtn { display: inline-flex; align-items: center; background: transparent; border: 0; box-shadow: inset 0 0 0 1px var(--line); border-radius: 99px; padding: 4px 12px; color: var(--muted); font-size: 0.82rem; font-weight: 500; line-height: 1.4; cursor: pointer; text-decoration: none; transition: color 0.15s, box-shadow 0.15s; }
.linkbtn:hover:not(:disabled), .linkbtn:focus-visible { color: var(--ink); box-shadow: inset 0 0 0 1px var(--faint); }
.linkbtn:disabled { opacity: 0.45; cursor: default; }
.linkbtn.more { font-size: 0.76rem; padding: 1px 9px; margin-top: 4px; }

/* followup ("Your move") */
.kicker { margin-bottom: 2px; font-size: 0.78rem; }
.callout { margin: 14px 20px 0 var(--indent); padding: 12px 14px; background: var(--sunken); border-radius: var(--r-md); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.callout .clamp3 { -webkit-line-clamp: 2; }
.instr { font-size: 0.92rem; font-weight: 500; color: var(--ink); line-height: 1.55; overflow-wrap: anywhere; }
.note-wrap { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; max-width: 100%; }
.note-txt { overflow-wrap: anywhere; }
.clamp3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

/* status badges: a small dot and a word */
.badge { display: inline-flex; align-items: center; gap: 7px; flex: none; font-size: 0.8rem; font-weight: 600; color: var(--muted); white-space: nowrap; }
.badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
.badge.sent::before { background: transparent; box-shadow: inset 0 0 0 1.5px var(--faint); }
.badge.prog { color: var(--info); } .badge.prog::before { background: var(--info); animation: pulse 1.8s ease-in-out infinite; }
.badge.confirm { color: var(--warn); } .badge.confirm::before { background: var(--warn); }
.badge.move { color: var(--ink); } .badge.move::before { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.badge.others::before { box-sizing: border-box; background: transparent; border: 1.5px dashed var(--faint); }
.badge.done { color: var(--ok); } .badge.done::before { content: "✓"; width: auto; height: auto; background: none; font-weight: 700; }
.badge.done.nocheck::before { content: ""; width: 7px; height: 7px; background: var(--ok); }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.8); } }

/* rows: sent, waiting and done items */
.tile.row { box-shadow: none; background: var(--surface); border-radius: var(--r-md); }
.row-head { display: grid; grid-template-columns: minmax(0, 1fr); padding: 16px 20px 0 20px; }
.row-top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; min-width: 0; }
.title-wrap { display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; min-width: 0; }
.tile.row .title { font-size: 1.02rem; }
.tile.row.done .title { color: var(--muted); }
.tile.row .tile-foot { padding: 10px 20px 16px var(--indent); }
.pend-ans { font-size: 0.9rem; color: var(--muted); overflow-wrap: anywhere; }
.pend-ans b { color: var(--ink); font-weight: 600; }
.pend-ans .ans-note { display: block; margin-top: 2px; color: var(--ink); overflow-wrap: anywhere; }
.pend-ans .ans-note.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pend-ans.earlier { font-size: 0.86rem; }
.pend-meta { font-size: 0.8rem; color: var(--faint); font-variant-numeric: tabular-nums; }
.rec-on a { color: var(--ink); text-decoration-color: var(--line); text-underline-offset: 3px; }
.agent { font-size: 0.9rem; color: var(--ink); overflow-wrap: anywhere; }
.when { font-size: 0.8rem; color: var(--faint); font-variant-numeric: tabular-nums; }

/* expanded body */
.tile-body { display: flex; flex-direction: column; gap: 22px; padding: 6px 20px 22px var(--indent); line-height: 1.6; min-width: 0; animation: open-in 0.2s ease-out; }
.tile-body > * { min-width: 0; }
@keyframes open-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.block { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
h3 { font-size: 0.82rem; font-weight: 600; color: var(--muted); margin: 0; }
.ctx { margin: 0; overflow-wrap: anywhere; }
.pts { margin: 0; padding-left: 1.15em; display: flex; flex-direction: column; gap: 6px; overflow-wrap: anywhere; }
.pts li::marker { color: var(--faint); }
.risks li::marker { color: var(--warn); }
.pts li.cmd-li { list-style: none; margin-left: -1.15em; }
.none { margin: 0; color: var(--muted); }
.changes { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.changes > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.changes dt { font-size: 0.86rem; font-weight: 600; color: var(--ink); overflow-wrap: anywhere; }
.changes dd { margin: 0; color: var(--muted); overflow-wrap: anywhere; }

/* disclosures: Background, Risks, Context checked */
.disc-group { display: flex; flex-direction: column; background: var(--sunken); border-radius: var(--r-md); overflow: hidden; }
.disc + .disc { border-top: 1px solid var(--surface); }
.disc > summary { display: flex; align-items: center; gap: 10px; padding: 12px 16px; cursor: pointer; list-style: none; font-size: 0.92rem; font-weight: 600; border-radius: 0; }
.disc > summary::-webkit-details-marker { display: none; }
.disc > summary::after { content: ""; width: 6px; height: 6px; margin-left: 4px; border-right: 1.5px solid var(--faint); border-bottom: 1.5px solid var(--faint); transform: rotate(-45deg); transition: transform 0.2s; flex: none; }
.disc[open] > summary::after { transform: rotate(45deg); }
.disc > summary:focus-visible { outline-offset: -2px; }
.disc-t { flex: 1; min-width: 0; }
.disc-aside { font-size: 0.84rem; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.disc-aside.warn { color: var(--warn); }
.disc-body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 6px; animation: open-in 0.18s ease-out; }
.chk { margin: 0; color: var(--ink); font-size: 0.9rem; overflow-wrap: anywhere; }
.chk-note { color: var(--muted); }
.unconfirmed { margin: 0; color: var(--warn); font-size: 0.9rem; font-weight: 600; }
.links { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; font-size: 0.9rem; }
.links a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; overflow-wrap: anywhere; }
.links a:hover { text-decoration-color: var(--ink); }
.links a.tk { text-decoration: none; }

/* commands */
.cmd { display: flex; flex-direction: column; gap: 6px; min-width: 0; max-width: 100%; }
.cmd-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.cmd pre { margin: 0; background: var(--sunken); border-radius: var(--r-md); padding: 12px 14px; overflow-x: auto; max-width: 100%; }
.cmd pre code { background: none; padding: 0; font-size: 0.82rem; line-height: 1.55; white-space: pre; overflow-wrap: normal; }

/* choices as selectable cards */
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 3px 12px; text-align: left; width: 100%; background: var(--surface); border: 0; border-radius: var(--r-md); padding: 14px 16px; box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; transition: box-shadow 0.15s, background 0.15s; }
.choice:hover { box-shadow: inset 0 0 0 1px var(--faint); }
.choice[aria-checked="true"] { background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px var(--accent); }
.dot { grid-row: 1; width: 18px; height: 18px; margin-top: 2px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--faint); transition: box-shadow 0.15s; }
.choice[aria-checked="true"] .dot { box-shadow: inset 0 0 0 5px var(--accent); }
.choice .row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font-weight: 600; min-width: 0; }
.tag { font-size: 0.78rem; font-weight: 600; color: var(--accent); }
.why { grid-column: 2; color: var(--muted); font-size: 0.9rem; line-height: 1.55; overflow-wrap: anywhere; }
.why b { font-weight: 600; color: var(--muted); }
label.note { display: flex; flex-direction: column; gap: 8px; font-size: 0.86rem; font-weight: 600; color: var(--muted); }
textarea { font: inherit; font-size: 0.95rem; font-weight: 400; color: var(--ink); background: var(--sunken); border: 0; border-radius: var(--r-md); padding: 12px 14px; min-height: 3em; resize: vertical; }
textarea::placeholder { color: var(--faint); }
.sum-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px 10px; margin-bottom: -10px; }
.send-sum { margin: 0; text-align: right; font-size: 0.86rem; color: var(--muted); overflow-wrap: anywhere; }
.sel-hint { grid-column: 2; font-size: 0.78rem; font-weight: 500; color: var(--muted); }
.body-send { display: flex; justify-content: flex-end; }
.act-box { display: flex; flex-direction: column; gap: 10px; padding: 0 20px 20px var(--indent); }

/* tracing */
.trace { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; font-size: 0.86rem; color: var(--muted); min-width: 0; max-width: 100%; }
.tt .trace { margin-top: 8px; }
.owner { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; min-width: 0; }
.handlers { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; }
.trace-k { font-size: 0.82rem; font-weight: 600; color: var(--muted); }
.hchip { display: inline-flex; align-items: center; gap: 6px; background: var(--sunken); border: 0; border-radius: 99px; padding: 3px 10px; font-size: 0.8rem; color: var(--ink); cursor: pointer; max-width: 100%; overflow-wrap: anywhere; }
.hchip i, .agentchip i { width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--ok); }
.hchip.running i, .agentchip.running i { background: var(--info); animation: pulse 1.8s ease-in-out infinite; }
.hchip.failed i, .agentchip.failed i { background: var(--err); }
.hsum { flex-basis: 100%; font-size: 0.84rem; color: var(--muted); overflow-wrap: anywhere; }
.trail { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; overflow-wrap: anywhere; }
.trail b { color: var(--ink); font-weight: 600; }

/* activity feed */
.dg-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; margin-left: 2px; }
.dg-title h2 { margin: 0; }
.dg-sub { margin: 0; font-size: 0.86rem; color: var(--faint); }
#digestList { display: flex; flex-direction: column; position: relative; }
#digestList::before { content: ""; position: absolute; left: 7px; top: 22px; bottom: 22px; width: 1px; background: var(--line); }
.dg { position: relative; }
.dg-head { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 0 10px; align-items: start; width: 100%; text-align: left; background: none; border: 0; padding: 12px 8px 12px 30px; cursor: pointer; border-radius: var(--r-md); }
.dg-head::before { content: ""; position: absolute; left: 3px; top: 19px; width: 9px; height: 9px; border-radius: 50%; background: var(--bg); box-shadow: inset 0 0 0 2px var(--faint); }
.dg-head:hover { background: var(--surface); }
.dg.open .dg-head::before { box-shadow: inset 0 0 0 5px var(--ink); }
.dg-area { font-weight: 600; font-size: 0.98rem; overflow-wrap: anywhere; }
.dg-count { font-size: 0.8rem; color: var(--faint); padding-top: 3px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.dg.open .chev { transform: rotate(-135deg); margin-top: 12px; }
.dg-items { padding: 0 8px 14px 48px; font-size: 0.92rem; animation: open-in 0.18s ease-out; }
.dg-items a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.dg-items a:hover { text-decoration-color: var(--ink); }

/* floating send and toast */
.dock { position: fixed; z-index: 5; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  left: max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 10px; pointer-events: none; }
.dock > * { pointer-events: auto; }
#status { background: var(--surface); color: var(--muted); box-shadow: var(--sh-2); border-radius: var(--r-md); padding: 10px 14px; font-size: 0.9rem; max-width: 100%; }
#status.ok { color: var(--ok); } #status.err { color: var(--err); }
.send { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 99px; padding: 12px 22px; font-weight: 600; font-size: 0.93rem; cursor: pointer; box-shadow: var(--sh-2); }
.send:disabled { opacity: 0.55; cursor: default; }

@media (max-width: 560px) {
  main { padding-block: 36px 150px; gap: 40px; }
  .tile { --indent: 16px; }
  .tile-head, .row-head { padding-left: 16px; padding-right: 16px; }
  .tile-foot, .tile-body, .act-box { padding-right: 16px; }
  .callout { margin-right: 16px; }
  .status-line { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; gap: 12px; white-space: nowrap; font-size: 0.86rem; }
  .status-line span { gap: 5px; }
  .status-line .long { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

<main>

    </div>

  </section>
</main>
<div class="dock">
  <span id="status" hidden></span>
  <button class="send" id="send" type="button" hidden>Send answers</button>
</div>

<script>
const $ = (id) => document.getElementById(id);
let db = null, decisions = [], responses = {}, layout = null, gotD = false, gotR = false;
const picks = {};   // id -> {choice, note}; only tiles Ben touched
let openId = null, submitting = false, act = null; // act: {id, kind: 'reply'|'reopen', text}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function notice(text, err) { const n = $("notice"); n.hidden = !text; n.textContent = text || ""; n.classList.toggle("err", !!err); }
function setStatus(text, kind) { const s = $("status"); s.hidden = !text; s.textContent = text || ""; s.className = kind || ""; }
function queuedIds() { return Object.keys(picks).filter((id) => picks[id].choice || (picks[id].note || "").trim()); }
function pick(id) { return picks[id] || (picks[id] = { choice: null, note: "" }); }
function strList(v) { return Array.isArray(v) ? v.filter((t) => t != null && String(t).trim()).map(String) : []; }
function ago(at) {
  const t = Date.parse(at); if (!at || isNaN(t)) return "";
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return "just now"; if (m < 60) return `${m} min ago`;
  const h = Math.round(m / 60); if (h < 24) return `${h} h ago`;
  const dd = Math.round(h / 24); return dd < 7 ? `${dd} d ago` : new Date(t).toLocaleDateString([], { month: "short", day: "numeric" });
}
function label(d, cid) { const c = (d.choices || []).find((c) => c.id === cid); return c ? (c.label || c.id) : null; }

// Page settings: a `meta/settings` doc can override these, so the page can be cloned for a teammate.
const DEFAULTS = { name: "Ben", title: "", cutoffAt: "2026-11-09T07:59:00Z", onsiteAt: "2026-11-15T16:00:00Z" };
const SETTINGS = { ...DEFAULTS };
// Last visit, for New / Updated badges. Per-viewer convenience only, so browser storage.
const VISIT_KEY = "decisions:lastVisit";
let prevVisit = null;
try { const v = Number(localStorage.getItem(VISIT_KEY)); if (v > 0) prevVisit = v; } catch (e) {}
function saveVisit() { try { localStorage.setItem(VISIT_KEY, String(Date.now())); } catch (e) {} }
setTimeout(saveVisit, 10000);
addEventListener("pagehide", saveVisit);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") saveVisit(); });

function greet() {
  const now = new Date(), h = now.getHours();
  $("hello").textContent = `Good ${h < 12 ? "morning" : h < 18 ? "afternoon" : "evening"}, ${SETTINGS.name}`;
  $("date").textContent = now.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
  document.title = SETTINGS.title || `Decisions for ${SETTINGS.name}`;
}
function span(ms) { const d = Math.floor(ms / 864e5), h = Math.floor((ms % 864e5) / 36e5); return d ? `${d}d ${h}h` : `${h}h ${Math.floor((ms % 36e5) / 6e4)}m`; }
function renderCountdown() {
  const now = Date.now(), c = Date.parse(SETTINGS.cutoffAt), o = Date.parse(SETTINGS.onsiteAt), parts = [];
  const item = (lead, val, passed) => { const s = el("span", passed ? "passed" : null, lead + " "); s.append(el("b", null, val)); return s; };
  if (!isNaN(c)) parts.push(c > now ? item("Image cutoff in", span(c - now)) : item("Image cutoff", "passed", true));
  if (!isNaN(o)) parts.push(o > now ? item("On site in", o - now >= 864e5 ? Math.floor((o - now) / 864e5) + "d" : span(o - now)) : item("On site", "passed", true));
  $("countdown").replaceChildren(...parts); $("countdown").hidden = !parts.length;
}
greet(); renderCountdown();

function urgency(d) {
  const t = Date.parse(d.due); if (!d.due || isNaN(t)) return "";
  const c = Date.parse(SETTINGS.cutoffAt), now = Date.now();
  if (t <= now || (!isNaN(c) && t <= c)) return "red";
  return t - now <= 3 * 864e5 ? "amber" : "";
}
function dueText(d) {
  const t = Date.parse(d.due); if (!d.due || isNaN(t)) return "No deadline";
  const days = dayDiff(t) * -1; // whole calendar days from today
  if (days < 0) return `Overdue ${-days}d`;
  if (days === 0) return "Due today";
  if (days === 1) return "Due tomorrow";
  if (days < 7) return "Due " + new Date(t).toLocaleDateString([], { weekday: "short" });
  return "Due " + new Date(t).toLocaleDateString([], { month: "short", day: "numeric" });
}
function ticketTone(s) { s = String(s || "").trim().toLowerCase(); return s === "done" ? "t-done" : s === "in testing" ? "t-test" : s === "in progress" ? "t-prog" : "t-back"; }
function tickets(d) { return Array.isArray(d.tickets) ? d.tickets.filter((t) => t && t.id) : []; }
function ticketText(t) { return `${t.id}${t.status ? " · " + t.status : ""}`; }
function freshness(d) {
  if (!prevVisit) return null; // first visit: everything would be "new"
  if (Date.parse(d.createdAt) > prevVisit) return ["new", "New"];
  if (Date.parse(d.changedAt) > prevVisit) return ["upd", "Updated"];
  return null;
}

const sending = new Set();   // ids with a write in flight
let editId = null;           // pending decision whose answer Ben is changing

function titleOf(id) { const d = decisions.find((x) => x.id === id); return (d && (d.title || d.id)) || id; }
function whyFailed(e) {
  if (e && e.code === "done") return e.message;
  return e && e.code === "invalid_argument" ? "Only the page owner can send answers." : (e && e.message) || "The save failed.";
}

function refreshDock() {
  const n = queuedIds().filter((id) => !sending.has(id)).length, b = $("send");
  b.hidden = !db || (n === 0 && !submitting);
  b.disabled = submitting;
  b.textContent = submitting ? "Sending…" : `Send ${n} answer${n === 1 ? "" : "s"}`;
}

function sendBtn(d, id, text) {
  const busy = sending.has(d.id), b = el("button", "send-one", busy ? "Sending…" : text);
  b.type = "button"; b.id = id; b.disabled = !db || busy || !queuedIds().includes(d.id);
  b.onclick = () => sendOne(d.id);
  return b;
}

function tileFoot(d) {
  const p = picks[d.id] || {}, foot = el("div", "tile-foot");
  const queued = queuedIds().includes(d.id), hasRec = d.recommended && label(d, d.recommended);
  if (queued) foot.append(el("span", "picked", p.choice ? label(d, p.choice) || p.choice : "Note added"));
  else if (hasRec) {
    const r = el("span", "rec-line", "Recommended: "); r.append(el("b", null, label(d, d.recommended))); foot.append(r);
  } else foot.append(el("span", "rec-line", "Open to see the options"));
  const acts = el("span", "acts");
  if (hasRec && !sending.has(d.id)) {
    const isRec = p.choice === d.recommended;
    const a = el("button", "accept" + (isRec ? " undo" : ""), isRec ? "Undo" : "Accept recommended");
    a.type = "button"; a.id = `a-${d.id}`;
    a.onclick = () => { const cur = pick(d.id); cur.choice = isRec ? null : d.recommended; setStatus(""); render(); };
    acts.append(a);
  }
  if (!sending.has(d.id)) {
    const on = !!(act && act.id === d.id && act.kind === "info");
    const m = el("button", "accept ghost", on ? "Cancel" : "Need more info"); m.type = "button"; m.id = `mi-${d.id}`;
    m.setAttribute("aria-expanded", String(on));
    m.onclick = () => { if (editId) { delete picks[editId]; editId = null; } act = on ? null : { id: d.id, kind: "info", text: "" }; setStatus(""); render(); };
    acts.append(m);
  }
  if (queued) acts.append(sendBtn(d, `s-${d.id}`, "Send"));
  if (acts.childElementCount) foot.append(acts);
  return foot;
}

// Tracing: who owns a decision, which subagents worked it, and its history.
const histOpen = new Set(), handlerOpen = new Set();
const shortId = (id) => String(id || "").slice(0, 8);
function handlers(d) { return Array.isArray(d.handlers) ? d.handlers.filter((h) => h && (h.id || h.label)) : []; }
function handlerSummary(d) {
  const hs = handlers(d); if (!hs.length) return null;
  const n = (s) => hs.filter((h) => h.status === s).length, run = n("running"), fail = n("failed");
  if (run) return ["running", `${run} agent${run > 1 ? "s" : ""} running`];
  if (fail) return ["failed", `${fail} agent${fail > 1 ? "s" : ""} failed`];
  return ["finished", `${hs.length} agent${hs.length > 1 ? "s" : ""} finished`];
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast("Copied"); }
  catch (e) { setStatus(`Copy didn't work here. Select it instead: ${text}`, "err"); }
}
function traceBlock(d) {
  const a = d.agent && typeof d.agent === "object" ? d.agent : null, hs = handlers(d);
  const trail = Array.isArray(d.trail) ? d.trail.filter((t) => t && t.action) : [];
  if (!a && !hs.length && !trail.length) return null;
  const box = el("div", "trace");
  if (a && (a.id || a.label)) {
    const line = el("div", "owner");
    const t = el("span", null, `Owned by ${a.label || a.kind || "an agent"}`);
    if (a.id) { const sid = el("code", null, shortId(a.id)); sid.title = String(a.id); t.append(" ", sid); }
    line.append(t);
    const copy = String(a.resume || a.id || "");
    if (copy) {
      const b = el("button", "linkbtn", "Copy"); b.type = "button"; b.id = `cp-${d.id}`;
      b.title = a.resume ? `Copy: ${a.resume}` : `Copy id: ${a.id}`;
      b.setAttribute("aria-label", a.resume ? "Copy resume command" : "Copy session id");
      b.onclick = () => copyText(copy);
      line.append(b);
    }
    box.append(line);
  }
  if (hs.length) {
    const row = el("div", "handlers"); row.append(el("span", "trace-k", "Handled by"));
    hs.forEach((h, i) => {
      const key = `${d.id}:${i}`, open = handlerOpen.has(key);
      const st = ["running", "finished", "failed"].includes(h.status) ? h.status : "finished";
      const c = el("button", "hchip " + st); c.type = "button"; c.id = `hd-${d.id}-${i}`;
      c.title = [h.id, h.status, h.summary].filter(Boolean).join(" · ");
      c.setAttribute("aria-expanded", String(open));
      c.append(el("i"), el("code", null, shortId(h.id)), " " + String(h.label || ""));
      c.onclick = () => { open ? handlerOpen.delete(key) : handlerOpen.add(key); render(); };
      row.append(c);
      if (open) row.append(el("span", "hsum", `${h.status || ""}${h.startedAt ? " · started " + ago(h.startedAt) : ""}${h.summary ? " · " + h.summary : ""}`));
    });
    box.append(row);
  }
  if (trail.length) {
    const open = histOpen.has(d.id);
    const b = el("button", "linkbtn", `History (${trail.length})`); b.type = "button"; b.id = `hi-${d.id}`;
    b.setAttribute("aria-expanded", String(open)); b.setAttribute("aria-controls", `hl-${d.id}`);
    b.onclick = () => { open ? histOpen.delete(d.id) : histOpen.add(d.id); render(); };
    box.append(b);
    if (open) {
      const ol = el("ol", "trail"); ol.id = `hl-${d.id}`;
      for (const t of trail) {
        const li = el("li"); li.append(el("span", "when", ago(t.at) || String(t.at || "")), " ", el("b", null, String(t.actor || "")), " " + String(t.action));
        ol.append(li);
      }
      box.append(ol);
    }
  }
  return box;
}

// Collapsed-by-default detail rows. Open state survives re-renders.
const discOpen = new Set();
function disclosure(d, key, title, aside, warn, ...kids) {
  const k = `${d.id}:${key}`, det = el("details", "disc"); det.open = discOpen.has(k);
  const sum = el("summary"); sum.id = `ds-${d.id}-${key}`;
  sum.append(el("span", "disc-t", title)); if (aside) sum.append(el("span", "disc-aside" + (warn ? " warn" : ""), aside));
  const body = el("div", "disc-body"); body.append(...kids);
  det.append(sum, body);
  det.ontoggle = () => { det.open ? discOpen.add(k) : discOpen.delete(k); };
  return det;
}
function section(title, ...kids) { const b = el("div", "block"); b.append(el("h3", null, title), ...kids); return b; }
// A command Ben runs himself: exact text in a code block with a Copy button (textContent only, never HTML).
function cmdBlock(text, id) {
  const box = el("div", "cmd"), head = el("div", "cmd-head"), pre = el("pre"), code = el("code", null, String(text));
  pre.append(code);
  const b = el("button", "linkbtn", "Copy"); b.type = "button"; b.id = id; b.setAttribute("aria-label", "Copy command");
  b.onclick = async () => {
    try { await navigator.clipboard.writeText(String(text)); toast("Copied"); }
    catch (e) {
      const sel = window.getSelection(); sel.removeAllRanges(); const r = document.createRange(); r.selectNodeContents(code); sel.addRange(r);
      setStatus("Clipboard is blocked here, so the command is selected. Press Cmd+C to copy it.", "err");
    }
  };
  head.append(el("span", "trace-k", "Run this"), b);
  box.append(head, pre);
  return box;
}
// Bullets with `code` spans; a "Command: ..." bullet becomes a copyable block (skipped when the decision has its own `command`).
// What the Send button will send, in one line.
function sendSummary(d) {
  const p = picks[d.id] || {}, l = p.choice ? label(d, p.choice) || p.choice : "", n = (p.note || "").trim();
  if (l && n) return `Sending: ${l} + your note`;
  if (l) return `Sending: ${l}`;
  if (n) return "Sending: your note only";
  return "Pick an option, add a note, or both.";
}
// Ben's sent answer: the choice label, then the note (clamped with a more/less toggle when long).
const ansOpen = new Set();
function answerEl(d, prefix) {
  const r = responses[d.id], wrap = el("span", "pend-ans");
  wrap.append(prefix);
  if (!r) { wrap.append(el("b", null, "No answer recorded")); return wrap; }
  const l = label(d, r.choice) || (r.choice ? String(r.choice) : null); if (l) wrap.append(el("b", null, l)); // raw id if the choices were rewritten
  const n = String(r.note || "").trim();
  if (n) {
    if (l) wrap.append(" + note");
    const long = n.length > 140, open = ansOpen.has(d.id);
    const q = el("span", "ans-note" + (long && !open ? " clamp2" : "")); codeText(q, n); wrap.append(q);
    if (long) {
      const b = el("button", "linkbtn more", open ? "less" : "more"); b.type = "button"; b.id = `an-${d.id}`;
      b.setAttribute("aria-expanded", String(open));
      b.onclick = () => { open ? ansOpen.delete(d.id) : ansOpen.add(d.id); render(); };
      wrap.append(b);
    }
  }
  if (!l && !n) wrap.append(el("b", null, "No answer recorded"));
  return wrap;
}
function bullets(list, cls, d, key) {
  const ul = el("ul", "pts" + (cls ? " " + cls : ""));
  list.forEach((t, i) => {
    const m = /^Command:\s*([\s\S]*)$/.exec(t);
    if (m && d) { if (d.command) return; const li = el("li", "cmd-li"); li.append(cmdBlock(m[1], `cmd-${d.id}-${key}${i}`)); ul.append(li); return; }
    const li = el("li"); codeText(li, t); ul.append(li);
  });
  return ul;
}

function tileBody(d) {
  const p = picks[d.id] || {}, body = el("div", "tile-body"); body.id = `b-${d.id}`;
  // an open tile already shows `what` in its header; rows (Change answer) don't
  if (d.what && !asTile(d)) body.append(section("What's being decided", el("p", "ctx", String(d.what))));
  if (typeof d.command === "string" && d.command.trim()) body.append(cmdBlock(d.command, `cmd-${d.id}`));
  const bg = strList(d.background); // shown in the disclosure group below
  if (d.when) body.append(section("When", el("p", "ctx", String(d.when))));
  const changes = Array.isArray(d.changes) ? d.changes.filter((c) => c && c.effect) : [];
  if (changes.length) {
    const dl = el("dl", "changes");
    for (const c of changes) { const g = el("div"); g.append(el("dt", null, label(d, c.choice) || String(c.choice || "")), (() => { const dd = el("dd"); codeText(dd, c.effect); return dd; })()); dl.append(g); }
    body.append(section("What changes", dl));
  }
  if (d.ifNoDecision) body.append(section("If you don't decide", el("p", "ctx", String(d.ifNoDecision))));
  if (Array.isArray(d.points) && d.points.length) body.append(bullets(strList(d.points), null, d, "pt"));
  else if (d.context && !d.what) body.append(el("p", "ctx", String(d.context)));
  const risks = strList(d.risks);
  const discs = el("div", "disc-group");
  if (bg.length) discs.append(disclosure(d, "bg", "Background", `${bg.length} point${bg.length > 1 ? "s" : ""}`, false, bullets(bg, null, d, "bg")));
  discs.append(disclosure(d, "rk", "Risks", risks.length ? String(risks.length) : "None known", risks.length > 0, risks.length ? bullets(risks, "risks", d, "rk") : el("p", "none", "None known")));
  {
    const ls = el("div", "links");
    for (const t of tickets(d)) {
      if (!/^https:\/\//.test(t.url || "")) continue; // shared data is untrusted
      const a = el("a", "tk " + ticketTone(t.status), ticketText(t)); a.href = t.url; a.target = "_blank"; a.rel = "noopener"; ls.append(a);
    }
    for (const l of (Array.isArray(d.links) ? d.links : [])) {
      if (!l || !/^https:\/\//.test(l.url || "")) continue; // shared data is untrusted
      const a = el("a", null, l.label || l.url); a.href = l.url; a.target = "_blank"; a.rel = "noopener"; ls.append(a);
    }
    if (ls.childElementCount) body.append(ls);
  }
  const checked = Array.isArray(d.checked) ? d.checked.filter((c) => c && c.source) : [], ck = [];
  if (checked.length) for (const c of checked) {
    const line = el("p", "chk", `✓ ${c.source}`); const when = ago(c.at); if (when) line.append(" ", el("span", "when", when));
    if (c.note) line.append(el("span", "chk-note", `, ${c.note}`));
    ck.push(line);
  } else ck.push(el("p", "unconfirmed", "Sources not confirmed"));
  discs.append(disclosure(d, "ck", "Context checked", checked.length ? `${checked.length} source${checked.length > 1 ? "s" : ""}` : "Not confirmed", !checked.length, ...ck));

async function doAct(id, kind) {

  const text = (act.text || "").trim(); if (kind === "reply" && !text) return;
  const r = responses[id] || {}, title = titleOf(id), now = new Date().toISOString();
  sending.add(id); setStatus(""); render();
  try {
    if (kind === "reopen") {
      const who = String(SETTINGS.name || "").trim() || "you";
      await db.doc("responses/" + id).set({ choice: null, note: text ? `Reopened by ${who}: ${text}` : `Reopened by ${who}`, submittedAt: now });
      await db.doc("decisions/" + id).update({ status: "open" });
      toast(`Reopened "${title}".`);
    } else if (kind === "info") {
      await db.doc("responses/" + id).set({ choice: null, note: text ? `Need more info: ${text}` : "Need more info", submittedAt: now });
      if (d.status !== "answered") await db.doc("decisions/" + id).update({ status: "answered" });
      delete picks[id]; if (openId === id) openId = null;
      toast(`Asked for more info on "${title}".`);
    } else {
      await db.doc("responses/" + id).set({ choice: r.choice || null, note: text, submittedAt: now });
      if (d.status !== "answered") await db.doc("decisions/" + id).update({ status: "answered" });

}

async function writeAnswer(id) {

  await db.doc("responses/" + id).set({ choice: p.choice || null, note: (p.note || "").trim(), submittedAt: new Date().toISOString() });
  if (d.status !== "answered") await db.doc("decisions/" + id).update({ status: "answered" });

  if (editId === id) editId = null;

async function submit() {
  const ids = queuedIds().filter((id) => !sending.has(id)); if (!ids.length || !db || submitting) return;
  submitting = true; for (const id of ids) sending.add(id); setStatus(""); render();
  const done = [];
  try {
    for (const id of ids) { await writeAnswer(id); done.push(id); sending.delete(id); }
    toast(`Sent ${done.length} answer${done.length > 1 ? "s" : ""}.`);
  } catch (e) {
    setStatus(`Saved ${done.length} of ${ids.length}. ${whyFailed(e)} Try again.`, "err");
  } finally { for (const id of ids) sending.delete(id); submitting = false; render(); }
}
// "What Claude did": read-only, lives below every decision group and re-renders only itself.
let digest = [], digestErr = null;
const digestOpen = new Set();
function renderDigest() {
  const sec = $("digestSec"); sec.hidden = false;
  const withPeriod = digest.find((g) => g.period);
  const stamps = digest.map((g) => Date.parse(g.updatedAt)).filter((t) => !isNaN(t));
  const sub = [withPeriod ? String(withPeriod.period) : "", stamps.length ? `Updated ${ago(new Date(Math.max(...stamps)).toISOString())}` : ""].filter(Boolean).join(" · ");
  $("digestSub").textContent = sub; $("digestSub").hidden = !sub;
  const f = document.activeElement, fid = f && f.id;
  const list = $("digestList");
  if (digestErr) { list.replaceChildren(el("p", "calm small", `Couldn't load this log (${digestErr}). Reload the page to try again.`)); return; }
  if (!digest.length) { list.replaceChildren(el("p", "calm small", "Nothing logged yet")); return; }
  list.replaceChildren(...digest.map((g) => {
    const open = digestOpen.has(g.id), items = Array.isArray(g.items) ? g.items.filter((i) => i && i.text) : [];
    const wrap = el("div", "dg" + (open ? " open" : ""));
    const b = el("button", "dg-head"); b.type = "button"; b.id = `dg-${g.id}`;
    b.setAttribute("aria-expanded", String(open)); b.setAttribute("aria-controls", `dgb-${g.id}`);
    const tt = el("span", "tt"); tt.append(el("span", "dg-area", String(g.area || g.id)));
    if (g.headline) tt.append(el("span", "sum", String(g.headline)));
    b.append(tt, el("span", "dg-count", `${items.length} item${items.length === 1 ? "" : "s"}`), el("span", "chev"));
    b.onclick = () => { open ? digestOpen.delete(g.id) : digestOpen.add(g.id); renderDigest(); };
    wrap.append(b);
    if (open) {
      const ul = el("ul", "pts dg-items"); ul.id = `dgb-${g.id}`;
      for (const it of items) {
        const li = el("li");
        if (/^https:\/\//.test(it.url || "")) { const a = el("a", null, String(it.text)); a.href = it.url; a.target = "_blank"; a.rel = "noopener"; li.append(a); } // shared data is untrusted
        else li.append(String(it.text));
        ul.append(li);
      }
      if (!items.length) ul.append(el("li", null, "No items"));
      wrap.append(ul);
    }
    return wrap;
  }));
  if (fid && fid.startsWith("dg-") && $(fid)) $(fid).focus({ preventScroll: true });
}
$("send").onclick = submit;
setInterval(() => { greet(); renderCountdown(); render(); if (db) renderDigest(); }, 60000); // keeps the relative times fresh

(async () => {
  db = await window.claude?.use?.("db").catch(() => null) ?? null;
  if (!db) { notice("Decisions can't load here. This page needs its data store, which is only available when you open it on claude.ai while signed in.", true); $("statusLine").textContent = "Unavailable"; return; }
  const timer = setTimeout(() => notice(decisions.length ? "Can't reach the data store right now. What you see may be out of date." : "Can't reach the data store yet. Check your connection; this page will keep trying.", true), 10000);
  db.collection("decisions").orderBy("order").onSnapshot((snap) => {
    if (!snap.metadata.fromCache) clearTimeout(timer);
    decisions = snap.docs.map((d) => ({ ...d.data(), id: d.id })); gotD = true;
    render();
  }, (e) => { clearTimeout(timer); db = null; notice(`Lost the connection to the data store (${e.code}). Reload the page to try again.`, true); refreshDock(); });
  db.doc("meta/settings").onSnapshot((snap) => {
    const v = (snap.exists && snap.data()) || {};
    const prevCutoff = SETTINGS.cutoffAt;
    for (const k of Object.keys(DEFAULTS)) SETTINGS[k] = typeof v[k] === "string" && v[k].trim() ? v[k].trim() : DEFAULTS[k];
    if (SETTINGS.cutoffAt !== prevCutoff && sortMode === "deadline") frozenBucket = {}; // deadline headers name the cutoff
    greet(); renderCountdown(); render();
  }, () => {});
  renderDigest();
  db.collection("digest").orderBy("order").onSnapshot((snap) => {
    digest = snap.docs.map((d) => ({ ...d.data(), id: d.id })); digestErr = null; renderDigest();
  }, (e) => { digestErr = (e && e.code) || "error"; renderDigest(); });
  db.collection("responses").onSnapshot((snap) => {
    responses = {}; for (const d of snap.docs) responses[d.id] = d.data(); gotR = true;
    render();
  }, () => { gotR = true; render(); });
})();
</script>
